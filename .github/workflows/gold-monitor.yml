name: Gold Bot Monitor — 24/7

# مراقب بوت الذهب: يعمل كل 5 دقائق تلقائياً (وأنت نائم)
# - يجلب التوقع الحي من الموقع المنشور
# - يفتح صفقة عند إشارة قوية ويتتبعها حتى TP/SL
# - يرسل إشعارات تيليجرام (سر TELEGRAM_BOT_TOKEN + chat_id يُكتشف تلقائياً بعد أول /start)
# - يحفظ الصفقات في data/trades.json → تظهر في «سجل الصفقات» بالموقع

on:
  schedule:
    - cron: "*/5 * * * *" # كل 5 دقائق (24/7 — السكربت يتخطى أوقات إغلاق السوق)
  workflow_dispatch: # تشغيل يدوي للاختبار

concurrency:
  group: gold-monitor
  cancel-in-progress: false

permissions:
  contents: write # للسماح بارتكاب تحديثات trades.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run gold bot monitor
        env:
          SIGNAL_URL: https://gold-trading-bot-omega.vercel.app/api/signal?mode=day
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor.py

      - name: Commit updated trades
        run: |
          git config user.name "gold-bot-monitor"
          git config user.email "monitor@gold-bot.local"
          git add data/trades.json
          if git diff --cached --quiet; then
            echo "لا تغييرات في سجل الصفقات"
          else
            git commit -m "monitor: trades update [skip ci]"
            git push
            echo "✓ حُفظ سجل الصفقات"
          fi
